<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>御養複方系列產品簡介</title>
<style>
:root{
  --ink:#3a2112; --brown:#6b3410; --burnt:#b4521a; --orange:#e07a24; --amber:#f2a541;
  --cream:#fff7ec; --sand:#fbe6cc;
  --ming:"PMingLiU","新細明體","MingLiU","細明體",serif;
  --sans:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#1e0f06;overflow:hidden;font-family:var(--sans);color:var(--ink)}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1600px;height:900px;flex:none;transform-origin:center center;overflow:hidden;background:#2a1408;box-shadow:0 20px 80px rgba(0,0,0,.5)}

/* ---------- slide base ---------- */
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .7s ease}
.slide.active{opacity:1;pointer-events:auto;z-index:2}
.bg{position:absolute;inset:-2%;background-size:cover;background-position:center;transform:scale(1.02)}
.slide.active .bg{animation:kenburns 22s ease-out forwards}
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.10)}}
.wash{position:absolute;inset:0}
.wash.warm{background:linear-gradient(135deg,rgba(255,247,236,.93) 0%,rgba(255,236,212,.86) 55%,rgba(250,214,170,.80) 100%)}
.wash.dark{background:linear-gradient(100deg,rgba(58,24,6,.94) 0%,rgba(110,46,12,.86) 45%,rgba(180,82,26,.35) 100%)}
.wash.ember{background:radial-gradient(ellipse at 70% 50%,rgba(224,122,36,.15),rgba(42,18,6,.88) 75%)}
.content{position:absolute;inset:0;padding:64px 80px 70px}

/* entrance animation */
.slide .anim{opacity:0;transform:translateY(24px)}
.slide.active .anim{animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--d,0) * 110ms + 150ms)}
@keyframes rise{to{opacity:1;transform:none}}

/* header */
.kicker{display:inline-flex;align-items:center;gap:12px;font-size:20px;letter-spacing:.18em;color:var(--burnt);font-weight:700}
.kicker .code{background:var(--burnt);color:#fff;padding:4px 14px;border-radius:999px;letter-spacing:.08em;font-family:Cambria,"Times New Roman",serif}
.title{font-family:var(--ming);font-weight:700;-webkit-text-stroke:.03em currentColor;font-size:54px;color:var(--brown);margin-top:8px;letter-spacing:.06em}
.title small{font-size:28px;color:var(--orange);margin-left:16px;letter-spacing:.04em}
.rule{width:120px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--burnt),var(--amber));margin:16px 0 26px}

/* footer */
.foot{position:absolute;left:80px;right:80px;bottom:22px;display:flex;justify-content:space-between;font-size:13px;color:rgba(107,52,16,.75);letter-spacing:.05em;z-index:3}
.dark-slide .foot{color:rgba(255,230,200,.7)}
.foot .pg{font-family:Cambria,"Times New Roman",serif;font-size:15px}

/* ---------- cover ---------- */
.cover .content{display:flex;flex-direction:column;justify-content:center;padding-left:120px}
.cover .series{font-size:24px;letter-spacing:.5em;color:var(--amber);font-weight:700}
.cover h1{font-family:var(--ming);font-weight:700;-webkit-text-stroke:.03em currentColor;font-size:118px;color:#fff;letter-spacing:.12em;margin:18px 0 8px;text-shadow:0 6px 30px rgba(0,0,0,.4)}
.cover h2{font-size:38px;color:#ffe2c0;font-weight:400;letter-spacing:.3em}
.cover .line{width:220px;height:4px;background:linear-gradient(90deg,var(--amber),transparent);margin:34px 0}
.cover .sub{font-size:24px;color:#ffd9b0;letter-spacing:.12em;line-height:1.8}
.cover .date{margin-top:40px;font-family:Cambria,"Times New Roman",serif;color:rgba(255,220,180,.75);font-size:20px;letter-spacing:.2em}

/* ---------- overview ---------- */
.grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.pcard{background:rgba(255,250,243,.94);border-radius:18px;padding:24px 24px 22px;box-shadow:0 10px 30px rgba(120,50,10,.15);border-top:6px solid var(--orange);cursor:pointer;transition:transform .25s,box-shadow .25s;min-height:300px;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(120,50,10,.28)}
.pcard .c{font-family:Cambria,"Times New Roman",serif;font-size:22px;color:var(--orange);font-weight:700;letter-spacing:.1em}
.pcard .n{font-family:var(--ming);font-weight:700;-webkit-text-stroke:.03em currentColor;font-size:34px;color:var(--brown);margin:8px 0 14px;line-height:1.25}
.pcard .k{margin-top:auto;font-size:20px;line-height:1.55;color:#5a3418;background:var(--sand);border-radius:10px;padding:10px 14px}
.pcard .k b{color:var(--burnt);display:block;font-size:14px;letter-spacing:.15em;margin-bottom:2px}

/* ---------- base (CM027) ---------- */
.two{display:flex;gap:34px;height:640px}
.panel{background:rgba(255,250,243,.95);border-radius:20px;padding:30px 36px;box-shadow:0 10px 30px rgba(120,50,10,.15)}
.facts{flex:1.25;display:flex;flex-direction:column;justify-content:space-around}
.fact{display:flex;gap:20px;align-items:flex-start}
.fact .lab{flex:none;width:130px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--burnt),var(--orange));border-radius:10px;padding:10px 0;text-align:center;font-size:20px;letter-spacing:.1em}
.fact .val{font-size:25px;line-height:1.6;padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--sand);color:var(--brown);border:1.5px solid rgba(224,122,36,.45);padding:5px 14px;border-radius:999px;font-size:19px}

/* ---------- product intro ---------- */
.pintro .photo{position:absolute;top:0;bottom:0;right:0;width:40%;background-size:cover;background-position:center}
.pintro .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(58,24,6,1) 0%,rgba(58,24,6,.0) 35%)}
.pintro .left{position:absolute;top:0;bottom:0;left:0;width:62%;padding:58px 40px 60px 80px;display:flex;flex-direction:column;color:#fff3e4}
.pintro .code{font-family:Cambria,"Times New Roman",serif;font-size:26px;color:var(--amber);letter-spacing:.3em;font-weight:700}
.pintro h2{font-family:var(--ming);font-weight:700;-webkit-text-stroke:.03em currentColor;font-size:72px;color:#fff;letter-spacing:.08em;margin:4px 0 14px;line-height:1.15}
.pintro .claim{display:inline-block;background:linear-gradient(90deg,var(--orange),var(--amber));color:#3a1a05;font-weight:700;font-size:24px;padding:9px 22px;border-radius:999px;letter-spacing:.06em;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.pintro .claim span{font-weight:400;opacity:.8;margin-right:8px;font-size:18px}
.pintro .fit{flex:1;min-height:0;overflow:hidden;margin-top:24px}
.pintro .sec{margin-bottom:.8em}
.pintro .sec h4{font-size:.82em;color:var(--amber);letter-spacing:.2em;margin-bottom:.3em;display:flex;align-items:center;gap:10px}
.pintro .sec h4::after{content:"";flex:1;height:1px;background:rgba(242,165,65,.35)}
.pintro .sec p{line-height:1.7;margin-bottom:.35em;text-align:justify}
.pintro .chips .chip{background:rgba(255,240,220,.12);color:#ffe9cf;border-color:rgba(242,165,65,.55);font-size:.9em}
.pintro .chips .chip.main{background:var(--amber);color:#3a1a05;border-color:var(--amber);font-weight:700}

/* ---------- ingredient cards ---------- */
.cards{display:flex;gap:26px;height:610px}
.card{flex:1;background:rgba(255,250,243,.95);border-radius:18px;box-shadow:0 10px 30px rgba(120,50,10,.16);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.card .ch{padding:18px 26px 14px;background:linear-gradient(90deg,var(--burnt),var(--orange) 70%,var(--amber));color:#fff;font-family:var(--ming);font-weight:700;-webkit-text-stroke:.03em currentColor;font-size:32px;letter-spacing:.06em;flex:none}
.card .ch.shared{background:linear-gradient(90deg,#7a3a12,#a8571f)}
.card .ch em{font-style:normal;font-family:var(--sans);font-size:15px;opacity:.85;margin-left:10px;letter-spacing:.1em;vertical-align:middle;border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:1px 10px}
.card .cb{flex:1;min-height:0;overflow:hidden;padding:18px 26px 20px}
.card .cb p{line-height:1.65;margin-bottom:.5em;text-align:justify;color:#4a2a14}
.card .cb .lh{font-weight:700;color:var(--burnt);margin:.4em 0 .3em;letter-spacing:.06em}
.card ol{list-style:none;counter-reset:n}
.card .sp{display:grid;grid-template-columns:1fr 1fr;gap:34px;height:100%}
.card .sp>div:first-child{border-right:2px dashed rgba(224,122,36,.3);padding-right:30px}
.card ol.c2{columns:2;column-gap:28px}
.card li{counter-increment:n;position:relative;padding-left:2em;line-height:1.5;margin-bottom:.42em;break-inside:avoid}
.card li::before{content:counter(n);position:absolute;left:0;top:.12em;width:1.45em;height:1.45em;border-radius:50%;background:var(--sand);color:var(--burnt);font-size:.82em;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:Cambria,"Times New Roman",serif;border:1.5px solid rgba(224,122,36,.5)}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:rgba(255,250,243,.96);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(120,50,10,.16)}
.tbl th{background:linear-gradient(90deg,var(--burnt),var(--orange));color:#fff;font-size:20px;padding:14px 18px;text-align:left;letter-spacing:.12em}
.tbl td{padding:15px 18px;font-size:21px;line-height:1.45;border-bottom:1px solid rgba(224,122,36,.18);vertical-align:middle}
.tbl tr:nth-child(even) td{background:rgba(251,230,204,.45)}
.tbl tr{cursor:pointer}
.tbl tbody tr:hover td{background:rgba(242,165,65,.25)}
.tbl td.code{font-family:Cambria,"Times New Roman",serif;color:var(--orange);font-weight:700;font-size:20px;white-space:nowrap}
.tbl td.nm{font-family:var(--ming);font-weight:700;-webkit-text-stroke:.03em currentColor;font-size:24px;color:var(--brown);white-space:nowrap}
.tbl td.cl{color:var(--burnt);font-weight:700;white-space:nowrap}

/* ---------- word cloud ---------- */
.cloudbar{display:flex;align-items:center;gap:14px;margin-top:-8px;margin-bottom:12px}
.btn{font-family:var(--sans);font-size:17px;border:1.5px solid var(--orange);background:rgba(255,250,243,.9);color:var(--burnt);padding:7px 18px;border-radius:999px;cursor:pointer;transition:.2s;letter-spacing:.06em}
.btn:hover{background:var(--sand)}
.btn.on{background:var(--orange);color:#fff}
.legend{margin-left:auto;display:flex;gap:18px;font-size:16px;color:#6b3410}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
#cloud{position:relative;width:1440px;height:610px;border-radius:24px;background:radial-gradient(ellipse at center,rgba(255,250,243,.92),rgba(255,240,222,.82) 70%,rgba(255,232,205,.6));box-shadow:inset 0 0 60px rgba(224,122,36,.18)}
.w{position:absolute;left:0;top:0;white-space:nowrap;font-weight:700;cursor:pointer;line-height:1;user-select:none;
   transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .6s,filter .3s,text-shadow .3s;will-change:transform}
.w:hover{text-shadow:0 4px 18px rgba(224,122,36,.55);filter:brightness(1.12)}
.w.dim{opacity:.16 !important}
.w.sel{text-shadow:0 0 22px rgba(242,165,65,.9)}
#info{position:absolute;right:22px;bottom:22px;width:420px;background:rgba(58,24,6,.94);color:#ffeedd;border-radius:18px;padding:20px 24px;box-shadow:0 14px 40px rgba(0,0,0,.35);opacity:0;transform:translateY(16px);transition:.35s;pointer-events:none}
#info.show{opacity:1;transform:none;pointer-events:auto}
#info h3{font-family:var(--ming);font-weight:700;-webkit-text-stroke:.03em currentColor;font-size:36px;color:#fff;letter-spacing:.06em}
#info .tp{display:inline-block;font-size:14px;background:var(--orange);color:#fff;border-radius:999px;padding:2px 12px;margin-left:10px;vertical-align:middle;font-family:var(--sans)}
#info .st{margin:8px 0 12px;color:#ffcf99;font-size:17px}
#info .pl{display:flex;flex-wrap:wrap;gap:8px}
#info .pl button{font-family:var(--sans);font-size:16px;background:rgba(255,240,220,.12);color:#ffe9cf;border:1px solid rgba(242,165,65,.6);border-radius:999px;padding:5px 12px;cursor:pointer}
#info .pl button:hover{background:var(--amber);color:#3a1a05}
#info .x{position:absolute;right:14px;top:10px;background:none;border:0;color:#ffcf99;font-size:24px;cursor:pointer}
.hint{position:absolute;left:24px;bottom:18px;font-size:15px;color:rgba(107,52,16,.7)}

/* ---------- chrome ---------- */
#progress{position:absolute;left:0;top:0;height:5px;background:linear-gradient(90deg,var(--burnt),var(--amber));z-index:10;transition:width .5s}
#nav{position:fixed;right:0;bottom:0;padding:40px 18px 16px 60px;display:flex;gap:8px;z-index:20;opacity:0;transition:opacity .3s}
#nav:hover{opacity:1}
#nav button{width:42px;height:42px;border-radius:50%;border:0;background:rgba(224,122,36,.92);color:#fff;font-size:18px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#nav button:hover{background:var(--burnt)}
#music{position:fixed;top:16px;right:18px;z-index:20;display:flex;align-items:center;gap:6px;background:rgba(58,24,6,.82);border:1px solid rgba(242,165,65,.5);border-radius:999px;padding:5px 6px 5px 6px;box-shadow:0 4px 18px rgba(0,0,0,.3);color:#ffe2c0;font-family:var(--sans);transition:opacity .3s}
#music button{border:0;cursor:pointer;font-family:var(--sans)}
#mPlay{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--amber));color:#3a1a05;font-size:17px;font-weight:700}
#mNext{width:30px;height:30px;border-radius:50%;background:rgba(255,240,220,.12);color:#ffe2c0;font-size:13px}
#mNext:hover{background:rgba(255,240,220,.25)}
#mLabel{font-size:14px;letter-spacing:.06em;padding:0 6px;white-space:nowrap;max-width:240px;overflow:hidden}
#music .bars{display:none;gap:2px;align-items:flex-end;height:14px;margin-left:4px}
#music.playing .bars{display:flex}
#music .bars i{width:3px;background:var(--amber);border-radius:1px;animation:eq 1s ease-in-out infinite}
#music .bars i:nth-child(2){animation-delay:.25s}#music .bars i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
#credits{position:fixed;inset:0;background:rgba(20,8,2,.8);z-index:30;display:none;align-items:center;justify-content:center}
#credits.show{display:flex}
#credits .box{background:var(--cream);border-radius:18px;max-width:900px;width:90%;max-height:85vh;overflow:auto;padding:28px 34px;font-size:15px;line-height:1.7}
#credits h3{font-family:var(--ming);font-weight:700;-webkit-text-stroke:.03em currentColor;font-size:28px;color:var(--brown);margin-bottom:10px}
#credits li{margin-left:1.2em}
#credits a{color:var(--burnt)}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="progress"></div></div></div>
<div id="nav">
  <button id="bPrev" title="上一張 (←)">◀</button>
  <button id="bNext" title="下一張 (→)">▶</button>
  <button id="bFull" title="全螢幕 (F)">⛶</button>
  <button id="bCred" title="圖片來源">ⓘ</button>
</div>
<div id="music" title="背景音樂 (M)">
  <button id="mPlay" aria-label="播放背景音樂">♪</button>
  <span class="bars"><i></i><i></i><i></i></span>
  <span id="mLabel">古琴《平沙落雁》</span>
  <button id="mNext" title="下一首" aria-label="下一首">⏭</button>
</div>
<audio id="bgm" preload="auto" src="music/guqin-pingsha.mp3"></audio>
<div id="credits"><div class="box"><h3>音樂來源</h3><ul id="musList"></ul><h3 style="margin-top:16px">圖片來源</h3><p>本簡報照片皆取自 Wikimedia Commons，依各授權條款標示：</p><ul id="credList"></ul><p style="margin-top:12px;color:#8a5a3a">（點擊任意處關閉）</p></div></div>

<script>
/* ============ 圖片與授權 ============ */
const IMG = {
  c00:{a:"mushroomclinicaltrials.com",l:"CC BY 2.0",u:"https://commons.wikimedia.org/wiki/File:Cordyceps_Militaris.jpg",pos:"center"},
  c01:{a:"Matej Frančeškin",l:"CC BY 4.0",u:"https://commons.wikimedia.org/wiki/File:Cordyceps_militaris_452741553.jpg",pos:"50% 45%"},
  c04:{a:"Fumikas Sagisavas",l:"CC0",u:"https://commons.wikimedia.org/wiki/File:Dried_cordyceps_militaris_(1).jpg",pos:"center"},
  c05:{a:"Fumikas Sagisavas",l:"CC0",u:"https://commons.wikimedia.org/wiki/File:Dried_cordyceps_militaris.jpg",pos:"center"},
  c06:{a:"Fumikas Sagisavas",l:"CC0",u:"https://commons.wikimedia.org/wiki/File:Fresh_cordyceps_militaris.jpg",pos:"center"},
  c07:{a:"Antrodia",l:"CC BY-SA 3.0",u:"https://commons.wikimedia.org/wiki/File:Harilik_kedrist%C3%B5lvik_(Cordyceps_militaris)_Eestis.JPG",pos:"52% 50%"},
  c08:{a:"François Nguyen",l:"CC BY 2.0",u:"https://commons.wikimedia.org/wiki/File:Jilin_Yongji_Cordyceps_militaris_(1).jpg",pos:"center"},
  c10:{a:"François Nguyen",l:"CC BY 2.0",u:"https://commons.wikimedia.org/wiki/File:Jilin_Yongji_Cordyceps_militaris_(3).jpg",pos:"center"},
  c11:{a:"Holger Krisp",l:"CC BY 3.0",u:"https://commons.wikimedia.org/wiki/File:Puppen-Kernkeule_Cordyceps_militaris.jpg",pos:"40% 50%"},
  c13:{a:"LunarLight",l:"CC BY-SA 4.0",u:"https://commons.wikimedia.org/wiki/File:Wild_Cordyceps_militaris.jpg",pos:"45% 60%"}
};

/* ============ 原文資料（取自 20201027御養複方系列產品簡介） ============ */
const CM = "採用優勢菌種 CM027(Cordyceps militaris)以無菌固體栽培之全株體(包含子實體、菌絲體、及少量孢子體)，複合維生素 A、D、E，加強原株含有之維生素群(富含維生素 B)、抗氧化物質 SOD、類胡蘿蔔素等，並且組合多項天然本草以強化其營養功能與吸收達到最佳化。其中蟲草的珍貴成份有蟲草素、蟲草多醣、蟲草多胜肽、蟲草微蛋白、核苷衍生物、胺基酸、維生素、微量元素…等。";
const MAIN = "冬蟲夏草 CM027(Cordyceps militaris)蟲草粉";

const CP = {t:"蟲草粉",s:1,l:["提高免疫力和造血功能","改善調節心腦系統","改善呼吸調節系統","降血脂、降血糖","補腎、護肝","健脾安神，協助神經衰弱治療","抗氧化、降低體內自由基","促進新陳代謝"]};
const VA = {t:"維生素 A",s:1,l:["細胞生長與分化","胚胎發育、器官形成","增強免疫功能，抗呼吸系統感染","維持視力及視覺發展","保護皮膚以及組織","抗癌","協助甲亢等疾病治療"]};

{code:"CC04",name:"蟲草纖素膠原粉末",claim:"幫助維持消化道機能，降低食慾",img:"c13",

 slides:[[CP,
   {t:"難消化性麥芽糊精(專利)",w:1.6,d:["難消化性麥芽糊精是一種白色無味的粉末，常用於食品中做為機能性食品原料使用，是水溶性膳食纖維的一種。它的結構具有可被人體消化分解的 α-1,4 及 α-1,6 澱粉結構，和無法被人體消化分解的 α-1,2、β-1,2 及 β-1,3 纖維結構，易溶於水，但不易被消化酵素分解，所以具有水溶性膳食纖維的作用，可做為腸道好菌的食物，能夠改變細菌叢生態，具有使排便順暢的功效。"],h:"功效:",l:["調整腸道機能","調節血糖","降低膽固醇","減少中性脂肪"]}],
  [{t:"菊糖粉",w:2.6,d:["菊糖是一種天然的多醣體，許多植物中都含有這種物質，包含大蒜、牛蒡、蘆筍、韭菜、小麥、洋蔥等等，產業上主要來自菊苣根部的萃取，通常添加在食品裡，以增加膳食纖維。它有幾個好處："],
    l:["增加腸道好菌：菊糖雖然無法被人體消化，卻能被腸道益菌分解利用。增加好菌數，抑制壞菌生長，增強腸道免疫力，是一種「益生質」。","控制血糖：菊糖具有減緩消化作用的效果，比較不會引起血糖的劇烈變化。","改善便秘：菊糖本身不會被消化，和纖維素一樣具有促進腸胃蠕動，防止便秘的效果。","健康減重：菊糖能夠減慢胃排空食物的速度，降低食慾，減少食量，達到減肥的效果。","促進吸收鈣質：菊糖本身就是一種天然的果寡糖，能提高人體對鈣和鎂的吸收功能，能預防骨質疏鬆。","降低膽固醇：部分研究指出菊糖可能有降低膽固醇的效果，不過這還有待進一步的研究。"]},
   {t:"乳糖醇",d:["乳糖醇（英語：Lactitol）是一種糖醇，可當作食品添加劑或瀉藥。其具有相對於蔗糖大約 40%的甜度，熱量也不高，可以在食品中作為甜味劑代替砂糖，或是乳化劑及增稠劑，在醫療方面亦能當作瀉藥。"],h:"功效:",l:["能被益生菌利用，進而維護大腸健康","刺激腸胃蠕動，治療或預防便祕","改善輕微的高膽固醇血症與大腸激躁症"]}],
  [{t:"魚膠原蛋白粉(專利)",solo:2,split:1,sr:"1.7fr 1fr",d:["魚類膠原蛋白組成結構與人體最接近，最容易被身體組織吸收，吸收率也最高。","膠原蛋白（Collagen）是動物身上最豐富的結構型蛋白（由多種氨基酸所形成，而 Collagen 這個文字源於希臘文 kólla，意指膠水）。在人類身上，膠原蛋白佔有總蛋白質量的三分之一，皮膚結構中更佔有四分之三，是細胞外基質及結締組織（如軟骨、硬骨、血管、角膜）中最重要的物質。","膠原蛋白除了賦予皮膚韌性、彈性及防水功能，它還是韌帶、肌腱、關節中的重要成分，若缺乏或製造不足將引發各種功能上的退化。身體製造膠原蛋白的能力會受年紀及生活方式影響，當年紀增長或生活習慣欠佳，身體的膠原蛋白會逐漸流失，出現各種外在及內在的改變。"],h:"功效:",l:["有益肌膚老化現象","有益骨質疏鬆","改善橘皮組織","有益肌少症","有益骨關節炎"]}],ADE]},

const cloud = document.getElementById('cloud');

const CW=1440, CH=610;
const COL = {i:['#b4521a','#8a3b12','#d2691e','#c0451a'], e:['#d99a3a','#a0602a','#e08a2e','#7a4a1c']};
const maxC = words[0].count, minC = words[words.length-1].count;
const meas = document.createElement('canvas').getContext('2d');
words.forEach((w,i)=>{
  const t = (Math.sqrt(w.count)-Math.sqrt(minC))/(Math.sqrt(maxC)-Math.sqrt(minC)||1);
  w.size = Math.round(22 + t*74);
  w.color = COL[w.type][i % 4];
  const el = document.createElement('span');
  el.className='w'; el.textContent=w.label;
  el.style.fontSize=w.size+'px'; el.style.color=w.color;
  el.style.fontFamily = w.type==='i' ? 'var(--ming)' : 'var(--sans)';
  if (w.type==='i') el.style.webkitTextStroke = '.03em currentColor';
  el.title = `${w.label}：提及 ${w.count} 次`;
  el.onclick = (ev)=>{ev.stopPropagation();select(w)};
  cloud.appendChild(el); w.el=el;
});
let filter='all';
function layout(randomize){
  const placed=[];
  const vis = words.filter(w=>filter==='all'||w.type===filter);
  words.forEach(w=>{ if(!vis.includes(w)){ w.el.style.opacity=0; w.el.style.pointerEvents='none'; }});
  const a0 = randomize ? Math.random()*Math.PI*2 : 0;
  vis.forEach((w,idx)=>{
    let size = w.size, ok=false, x=0,y=0,bw=0,bh=0;
    for(let tries=0; tries<6 && !ok; tries++){
      meas.font = `700 ${size}px ${w.type==='i'?'PMingLiU,新細明體':'Microsoft JhengHei'}`;
      bw = meas.measureText(w.label).width + 24; bh = size*1.08 + 6;
      const dir = (idx%2? 1:-1);
      for(let s=0; s<4000; s++){
        const ang = a0 + s*0.18*dir, r = 2.2*Math.sqrt(s)*6;
        x = CW/2 + r*Math.cos(ang)*1.55 - bw/2;
        y = CH/2 + r*Math.sin(ang)*0.75 - bh/2;
        if (x<10||y<10||x+bw>CW-10||y+bh>CH-10) continue;
        if (!placed.some(p=> x<p.x+p.w && x+bw>p.x && y<p.y+p.h && y+bh>p.y)){ ok=true; break; }
      }
      if(!ok) size*=0.85;
    }
    if(!ok){ w.el.style.opacity=0; return; }
    placed.push({x,y,w:bw,h:bh});
    w.el.style.fontSize = size+'px';
    w.el.style.opacity = 1; w.el.style.pointerEvents='auto';
    w.el.style.transitionDelay = (idx*18)+'ms';
    w.el.style.transform = `translate(${x+7}px,${y+3}px)`;
  });
}
function burst(){ // 從中心綻放
  words.forEach(w=>{w.el.style.transitionDelay='0ms';w.el.style.transform=`translate(${CW/2-40}px,${CH/2-20}px) scale(.1)`;w.el.style.opacity=0;});
  setTimeout(()=>layout(false), 60);
}
function select(w){
  words.forEach(o=>{o.el.classList.toggle('dim',o!==w); o.el.classList.toggle('sel',o===w);});
  info.querySelector('h3').innerHTML = `${w.label}<span class="tp">${w.type==='i'?'成分':'功效'}</span>`;
  info.querySelector('.st').textContent = `出現在 ${w.prods.length} 項產品 · 原文共提及 ${w.count} 次`;
  info.querySelector('.pl').innerHTML = w.prods.map(p=>`<button data-go="${p.code}">${p.code} ${p.name}</button>`).join('');
  info.classList.add('show');
}
function unselect(){ words.forEach(o=>o.el.classList.remove('dim','sel')); info.classList.remove('show'); }

let cur = 0;
const prog = document.getElementById('progress');
function go(i){
  i = Math.max(0, Math.min(slides.length-1, i));
  slides[cur].classList.remove('active');
  // 重新觸發動畫
  const s = slides[i]; s.classList.remove('active'); void s.offsetWidth; s.classList.add('active');
  cur = i; prog.style.width = ((i+1)/slides.length*100)+'%';
  try { history.replaceState(null,'','#'+(i+1)); } catch(e) {}
  if (s.classList.contains('cloudslide')) { unselect(); setTimeout(burst, 350); }
}
document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]');
  if (g) { e.stopPropagation(); go(productStart[g.dataset.go]); }
});
document.addEventListener('keydown', e=>{
  if (['ArrowRight','PageDown',' ','Enter'].includes(e.key)) { e.preventDefault(); go(cur+1); }
  else if (['ArrowLeft','PageUp','Backspace'].includes(e.key)) { e.preventDefault(); go(cur-1); }
  else if (e.key==='Home') go(0);
  else if (e.key==='End') go(slides.length-1);
  else if (e.key==='f'||e.key==='F') toggleFull();
  else if (e.key==='m'||e.key==='M') toggleMusic();
  else if (e.key==='i'||e.key==='I') document.getElementById('credits').classList.toggle('show');
  else if (e.key==='Escape') document.getElementById('credits').classList.remove('show');
});
let tx=null;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>60) go(cur+(dx<0?1:-1)); tx=null;});
function toggleFull(){ try { const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(()=>{}); } catch(e) {} }
document.getElementById('bPrev').onclick=()=>go(cur-1);
document.getElementById('bNext').onclick=()=>go(cur+1);
document.getElementById('bFull').onclick=toggleFull;
const cr = document.getElementById('credits');
document.getElementById('credList').innerHTML = Object.entries(IMG).map(([k,v])=>`<li>${k}.jpg — ${v.a}，${v.l}，<a href="${v.u}" target="_blank">${decodeURIComponent(v.u.split('File:')[1]).replace(/_/g,' ')}</a></li>`).join('');
document.getElementById('bCred').onclick=()=>cr.classList.add('show');

/* ============ 背景音樂 ============ */
const TRACKS = [
  {src:"music/guqin-pingsha.mp3", name:"古琴《平沙落雁》", a:"Charlie Huang（演奏）", l:"CC BY 2.5", u:"https://commons.wikimedia.org/wiki/File:Pingsha_Luoyan.ogg", note:"曲譜：蕉庵琴譜 (1868)"},
  {src:"music/guqin-peilan.mp3", name:"古琴《佩蘭》", a:"Charlie Huang（演奏）", l:"CC BY 2.5", u:"https://commons.wikimedia.org/wiki/File:Pei_Lan.ogg", note:"曲譜：天聞閣琴譜 (1876)"}
];
document.getElementById('musList').innerHTML = TRACKS.map(t=>`<li>${t.name} — ${t.a}，${t.l}${t.note?'，'+t.note:''}，<a href="${t.u}" target="_blank">Wikimedia Commons</a></li>`).join('');
const bgm = document.getElementById('bgm'), mBox = document.getElementById('music'),
      mPlay = document.getElementById('mPlay'), mLabel = document.getElementById('mLabel');
let tIdx = 0, fadeT = null, userPaused = false;
const VOL = 0.35;
function loadTrack(i){ tIdx = (i + TRACKS.length) % TRACKS.length; bgm.src = TRACKS[tIdx].src; mLabel.textContent = TRACKS[tIdx].name; }
function fadeTo(target, ms, done){
  clearInterval(fadeT); const start = bgm.volume, t0 = Date.now();
  fadeT = setInterval(()=>{ const k = Math.min(1,(Date.now()-t0)/ms); bgm.volume = start + (target-start)*k; if(k>=1){clearInterval(fadeT); done&&done();} }, 40);
}
function playMusic(){
  userPaused = false;
  if (!bgm.src) loadTrack(0);
  bgm.volume = VOL;
  const p = bgm.play();
  const ok = ()=>{ mBox.classList.add('playing'); mPlay.textContent='❚❚'; mLabel.textContent = TRACKS[tIdx].name; bgm.volume = VOL; };
  if (p && p.then) p.then(ok).catch(()=>{ mLabel.textContent='瀏覽器未允許播放'; }); else ok();
}
function pauseMusic(){ userPaused = true; fadeTo(0, 500, ()=>bgm.pause()); mBox.classList.remove('playing'); mPlay.textContent='♪'; }
function toggleMusic(){ (bgm.paused || !mBox.classList.contains('playing')) ? playMusic() : pauseMusic(); }
mPlay.onclick = toggleMusic;
document.getElementById('mNext').onclick = ()=>{ const was = mBox.classList.contains('playing'); loadTrack(tIdx+1); if (was) playMusic(); };
bgm.addEventListener('ended', ()=>{ loadTrack(tIdx+1); playMusic(); });
tIdx = 0;
/* 開啟即嘗試播放；若瀏覽器擋自動播放，就在第一次點擊／按鍵／觸控時立刻開始 */
function autoStart(){
  if (userPaused || mBox.classList.contains('playing')) return;
  const p = bgm.play();
  const ok = ()=>{ bgm.volume = VOL; mBox.classList.add('playing'); mPlay.textContent='❚❚'; mLabel.textContent = TRACKS[tIdx].name; cleanup(); };
  if (p && p.then) p.then(ok).catch(()=>{}); else ok();
}
const EVTS = ['pointerdown','keydown','touchstart'];
function onFirst(e){ if (e.target && e.target.closest && e.target.closest('#music')) return; if (e.type==='keydown' && (e.key==='m'||e.key==='M')) return; autoStart(); }
function cleanup(){ EVTS.forEach(t=>document.removeEventListener(t, onFirst, true)); }
EVTS.forEach(t=>document.addEventListener(t, onFirst, true));
autoStart();
cr.onclick=()=>cr.classList.remove('show');

function scale(){ const k=Math.min(innerWidth/1600, innerHeight/900); stage.style.transform=`scale(${k})`; }
addEventListener('resize', scale); scale();

fitAll();
layout(false);
const start = parseInt(location.hash.slice(1)) - 1;
go(isNaN(start) ? 0 : start);
</script>
</body>
</html>
